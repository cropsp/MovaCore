<!doctype html><html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; background: #fbf4e2; font-family: 'DejaVu Sans', sans-serif; color: #1b2a33;
         display: flex; align-items: center; overflow: hidden; position: relative; }
  .art { width: 420px; height: 420px; margin-left: 70px; flex: none; }
  .text { margin-left: 50px; margin-right: 70px; }
  h1 { font-size: 104px; margin: 0 0 14px; letter-spacing: -2px; font-weight: 800; }
  p { font-size: 34px; line-height: 1.32; margin: 0 0 34px; color: #34444d; }
  .demo { display: flex; align-items: center; gap: 18px; font-size: 38px; }
  .chip { background: #fff; border: 3px solid #d9c7a5; border-radius: 16px; padding: 10px 22px; }
  .wrong { color: #8a7a62; }
  .key { border: 3px solid #1b2a33; border-radius: 12px; padding: 6px 14px; font-weight: 700; font-size: 30px;
         box-shadow: 0 5px 0 #d9c7a5; background: #fff; }
  .arrow { color: #d97a3e; font-weight: 700; }
  .grass { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: #9fcb6b; border-top: 3px solid #2f5626; }
</style></head><body>
  <img class="art" src="mouse-440.png" alt="">
  <div class="text">
    <h1>MovaCore</h1>
    <p>Fix text typed in the wrong keyboard layout with one key, and dictate offline. For Windows.</p>
    <div class="demo"><span class="chip wrong">ghbdsn</span><span class="key">F10</span><span class="arrow">→</span><span class="chip">привіт</span></div>
  </div>
  <div class="grass"></div>
</body></html>
